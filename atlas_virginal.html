<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atlas Vernaculaire — Wallonie</title>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --vert:    #2D6A2D;
    --vert-bg: #EEF6EE;
    --bleu:    #1A3F8F;
    --bleu-bg: #EBF0FA;
    --orange:  #B85C00;
    --orange-bg: #FEF3E6;
    --rouge:   #A0001E;
    --rouge-bg: #FDEAEA;
    --ink:     #1C1C1C;
    --paper:   #F8F5EF;
    --stone:   #9C9080;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--paper);
    color: var(--ink);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── HEADER ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 28px;
    background: var(--ink);
    color: var(--paper);
    z-index: 10;
    flex-shrink: 0;
  }
  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    letter-spacing: .04em;
    font-weight: 400;
  }
  header h1 span {
    font-style: italic;
    color: #c8b99a;
  }
  .header-sub {
    font-size: 11px;
    color: #9a9080;
    letter-spacing: .12em;
    text-transform: uppercase;
  }

  /* ── MAP ── */
  #map {
    flex: 1;
    width: 100%;
  }

  /* ── MARKER ── */
  .marker-wrap {
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: transform .2s;
  }
  .marker-wrap:hover { transform: scale(1.08); }
  .marker-img {
    width: 72px;
    height: 72px;
    border-radius: 4px;
    border: 2px solid var(--ink);
    background: white;
    object-fit: cover;
    box-shadow: 3px 3px 0 rgba(0,0,0,.25);
  }
  .marker-label {
    margin-top: 4px;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: .08em;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--ink);
    padding: 2px 7px;
    border-radius: 2px;
    white-space: nowrap;
    box-shadow: 1px 1px 0 rgba(0,0,0,.15);
  }

  /* ── PANEL ── */
  #panel {
    position: fixed;
    top: 0; right: -480px;
    width: 460px;
    height: 100vh;
    background: var(--paper);
    border-left: 2px solid var(--ink);
    z-index: 100;
    display: flex;
    flex-direction: column;
    transition: right .4s cubic-bezier(.4,0,.2,1);
    overflow: hidden;
  }
  #panel.open { right: 0; }

  .panel-cover {
    width: 100%;
    height: 220px;
    object-fit: cover;
    flex-shrink: 0;
    border-bottom: 2px solid var(--ink);
    background: #ddd;
  }
  .panel-cover-fallback {
    width: 100%;
    height: 220px;
    flex-shrink: 0;
    border-bottom: 2px solid var(--ink);
    background: linear-gradient(135deg, #e8e0d4 0%, #d4c8b4 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Playfair Display', serif;
    font-size: 32px;
    color: var(--stone);
    letter-spacing: .1em;
  }

  .panel-body {
    flex: 1;
    overflow-y: auto;
    padding: 24px 28px 32px;
  }

  .panel-close {
    position: absolute;
    top: 12px; left: 12px;
    background: var(--ink);
    color: var(--paper);
    border: none;
    width: 32px; height: 32px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    z-index: 10;
    transition: background .15s;
  }
  .panel-close:hover { background: #444; }

  .panel-tag {
    display: inline-block;
    font-size: 10px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--stone);
    border: 1px solid #c8b99a;
    padding: 3px 9px;
    border-radius: 20px;
    margin-bottom: 10px;
  }

  .panel-title {
    font-family: 'Playfair Display', serif;
    font-size: 26px;
    font-weight: 700;
    line-height: 1.2;
    margin-bottom: 4px;
  }
  .panel-date {
    font-size: 12px;
    color: var(--stone);
    margin-bottom: 14px;
    letter-spacing: .06em;
  }

  .panel-meta {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .meta-chip {
    font-size: 11px;
    background: white;
    border: 1px solid #ddd;
    border-radius: 3px;
    padding: 4px 10px;
    color: #555;
  }

  .panel-synth {
    font-size: 14px;
    line-height: 1.7;
    color: #3a3228;
    border-left: 3px solid #c8b99a;
    padding-left: 14px;
    margin-bottom: 24px;
    font-style: italic;
  }

  /* ── SECTION LABELS ── */
  .section-label {
    font-size: 10px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--stone);
    margin-bottom: 10px;
  }

  /* ── BOUTONS ANALYSE ── */
  .btn-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 10px;
  }

  .btn-analyse {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 14px;
    border-radius: 6px;
    border: 2px solid;
    text-decoration: none;
    font-weight: 500;
    font-size: 13px;
    transition: transform .15s, box-shadow .15s;
    cursor: pointer;
  }
  .btn-analyse:hover {
    transform: translateY(-2px);
    box-shadow: 3px 3px 0 rgba(0,0,0,.18);
  }
  .btn-analyse .btn-icon { font-size: 18px; }
  .btn-analyse .btn-text { display: flex; flex-direction: column; }
  .btn-analyse .btn-text strong { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
  .btn-analyse .btn-text span { font-size: 10px; opacity: .7; margin-top: 1px; }

  .btn-histoire  { background: var(--vert-bg);   color: var(--vert);   border-color: var(--vert); }
  .btn-territoire{ background: var(--bleu-bg);   color: var(--bleu);   border-color: var(--bleu); }
  .btn-batiment  { background: var(--orange-bg); color: var(--orange); border-color: var(--orange); }

  /* AVENIR pleine largeur */
  .btn-avenir {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 14px;
    border-radius: 6px;
    border: 2px solid var(--rouge);
    background: var(--rouge-bg);
    color: var(--rouge);
    text-decoration: none;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: .1em;
    text-transform: uppercase;
    transition: transform .15s, box-shadow .15s, background .15s;
    width: 100%;
    margin-top: 0;
  }
  .btn-avenir:hover {
    background: var(--rouge);
    color: white;
    transform: translateY(-2px);
    box-shadow: 4px 4px 0 rgba(160,0,30,.25);
  }
  .btn-avenir .avenir-arrow { font-size: 20px; }

  /* ── DIVIDER ── */
  .divider {
    border: none;
    border-top: 1px solid #ddd;
    margin: 20px 0;
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>Atlas Vernaculaire — <span>Wallonie</span></h1>
    <div class="header-sub">Région du Hainaut Central · Étude de cas</div>
  </div>
  <div class="header-sub" style="text-align:right">Master Ingénieur Civil Architecte<br>TFE 2026</div>
</header>

<div id="map"></div>

<!-- PANEL LATÉRAL -->
<div id="panel">
  <button class="panel-close" onclick="closePanel()" title="Fermer">✕</button>
  <img id="panel-img" class="panel-cover" src="" alt="" onerror="this.style.display='none'; document.getElementById('panel-cover-fallback').style.display='flex';">
  <div id="panel-cover-fallback" class="panel-cover-fallback" style="display:none">❧</div>

  <div class="panel-body">
    <div class="panel-tag" id="panel-commune">Virginal · Ittre</div>
    <div class="panel-title" id="panel-title">—</div>
    <div class="panel-date" id="panel-date">—</div>

    <div class="panel-meta" id="panel-meta"></div>

    <div class="panel-synth" id="panel-synth">—</div>

    <hr class="divider">

    <div class="section-label">Analyse</div>
    <div class="btn-grid">
      <a id="btn-histoire"   class="btn-analyse btn-histoire"   href="#" target="_blank">
        <span class="btn-icon">🌿</span>
        <span class="btn-text"><strong>Histoire</strong><span>Ligne du temps</span></span>
      </a>
      <a id="btn-territoire" class="btn-analyse btn-territoire" href="#" target="_blank">
        <span class="btn-icon">🗺</span>
        <span class="btn-text"><strong>Territoire</strong><span>Implantation</span></span>
      </a>
      <a id="btn-batiment"   class="btn-analyse btn-batiment"   href="#" target="_blank">
        <span class="btn-icon">🧱</span>
        <span class="btn-text"><strong>Bâtiment</strong><span>Construction</span></span>
      </a>
      <!-- placeholder 4e cellule pour équilibre visuel -->
      <div></div>
    </div>

    <hr class="divider" style="margin-top:4px">
    <div class="section-label">Synthèse projective</div>
    <a id="btn-avenir" class="btn-avenir" href="#" target="_blank">
      <span class="avenir-arrow">✦</span>
      AVENIR
      <span class="avenir-arrow">→</span>
    </a>
  </div>
</div>

<script>
mapboxgl.accessToken = 'pk.eyJ1IjoiZWxvcnZ6IiwiYSI6ImNtcHZ0bGJieDFxbjcycnNldmRyMGs4N2YifQ.LJ612zMeg-IwJ1V4CTFMVQ';

const map = new mapboxgl.Map({
  container: 'map',
  style: 'mapbox://styles/mapbox/outdoors-v12',
  center: [4.3717, 50.6003],
  zoom: 14,
  pitch: 30,
  bearing: -10
});

map.addControl(new mapboxgl.NavigationControl(), 'bottom-right');

// ── DONNÉES BÂTIMENTS ──
const buildings = [
  {
    id: 'dujaquier',
    name: 'Maison Dujaquier & Flandroy',
    commune: 'Virginal · Ittre',
    date: 'Construite en 1875',
    materiaux: ['Brique locale', 'Pierre bleue de Soignies', 'Charpente chêne'],
    occupants: '4 occupants documentés (1875–2026)',
    synth: 'Maison de village en brique locale, implantée en bordure de la Rue Bruyère. Témoin des savoir-faire du Hainaut Central : appareillage soigné, pierre bleue de Soignies en seuil et linteaux, charpente en chêne de la région.',
    lngLat: [4.3717, 50.6003],
    facadeUrl: 'https://drive.google.com/uc?export=view&id=1mthirerLjlqNZkwVIeSM_Zgo4wrthdsd',
    links: {
      histoire:   'https://drive.google.com/file/d/1Zacab9WWccs5JM38gJQ3QXWosusPo7R8/view?usp=share_link',
      territoire: 'https://drive.google.com/file/d/1_E3ASWCCZ_gaPEHDut33PGVxaQ2Vp7u6/view?usp=share_link',
      batiment:   'https://drive.google.com/file/d/1q9OkLHkx4K9oJimwQwpaKUpVsviefzlB/view?usp=share_link',
      avenir:     'https://drive.google.com/file/d/159kcLto1pJvtusVJyo5Qre_xDsZPtiZU/view?usp=share_link'
    }
  }
  // → Ajouter d'autres bâtiments ici
];

// ── CRÉATION MARQUEURS ──
buildings.forEach(b => {
  const el = document.createElement('div');
  el.className = 'marker-wrap';

  const img = document.createElement('img');
  img.className = 'marker-img';
  img.src = b.facadeUrl;
  img.alt = b.name;
  img.onerror = () => { img.src = ''; img.style.background = '#e8e0d4'; };

  const lbl = document.createElement('div');
  lbl.className = 'marker-label';
  lbl.textContent = b.name.split(' ')[1] || b.name; // court label

  el.appendChild(img);
  el.appendChild(lbl);

  el.addEventListener('click', () => openPanel(b));

  new mapboxgl.Marker({ element: el, anchor: 'bottom' })
    .setLngLat(b.lngLat)
    .addTo(map);
});

// ── PANEL ──
function openPanel(b) {
  // Image
  const pImg = document.getElementById('panel-img');
  const pFallback = document.getElementById('panel-cover-fallback');
  pImg.style.display = 'block';
  pFallback.style.display = 'none';
  pImg.src = b.facadeUrl;

  document.getElementById('panel-commune').textContent = b.commune;
  document.getElementById('panel-title').textContent = b.name;
  document.getElementById('panel-date').textContent = b.date + ' · ' + b.occupants;

  // Chips matériaux
  const metaEl = document.getElementById('panel-meta');
  metaEl.innerHTML = b.materiaux.map(m => `<span class="meta-chip">${m}</span>`).join('');

  document.getElementById('panel-synth').textContent = b.synth;

  document.getElementById('btn-histoire').href   = b.links.histoire;
  document.getElementById('btn-territoire').href = b.links.territoire;
  document.getElementById('btn-batiment').href   = b.links.batiment;
  document.getElementById('btn-avenir').href     = b.links.avenir;

  document.getElementById('panel').classList.add('open');

  // Zoom sur le marqueur
  map.flyTo({ center: b.lngLat, zoom: 16, pitch: 45, speed: 0.9 });
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
  map.flyTo({ zoom: 14, pitch: 30, speed: 0.7 });
}

// Fermer avec Échap
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
</script>
</body>
</html>
